name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crates/engine/**"
      - "crates/ui/**"
      - "crates/json-file/**"
      - "crates/relay-proto/**"
      - "extensions/**"
      - "build.rs"
      - "assets/**"
      - ".gitattributes"
      - "scripts/bundle.sh"
      - "scripts/dmg.py"
      - "scripts/windows.iss"
      - "scripts/wsl-install.sh"
      - "scripts/release_notes.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pick version
        id: pick
        run: |
          minor=$(sed -nE 's/^version = "([0-9]+\.[0-9]+)\..*"/\1/p' Cargo.toml)
          patch=$(git tag --list "v$minor.*" | wc -l | tr -d ' ')
          echo "version=$minor.$patch" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: Ludolph.zip
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build binary
        run: LUDOLPH_VERSION="$VERSION" cargo build --release --locked --target "$TARGET" -p ludolph
      - name: Check version
        run: strings "target/$TARGET/release/ludolph" | grep -q "<string>$VERSION</string>"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - uses: oven-sh/setup-bun@v2
      # A self-signed certificate, the same for every release, so macOS keeps
      # the microphone, speech and Keychain grants when Ludolph updates.
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Package app
        env:
          LUDOLPH_SIGN_IDENTITY: Ludolph Code Signing
        run: |
          mkdir dist
          scripts/bundle.sh "target/$TARGET/release/ludolph" "$VERSION" dist
          codesign --verify --strict -R "=identifier \"dev.iyazerski.ludolph\" and certificate leaf = H\"$(sed -nE 's/^leaf="([0-9a-f]+)"$/\1/p' install.sh)\"" dist/Ludolph.app
          # Without extended attributes, which `codesign --verify --strict` refuses
          # in install.sh and the updater.
          ditto -c -k --norsrc --noextattr --keepParent dist/Ludolph.app "dist/$ASSET"
          uvx dmgbuild -s scripts/dmg.py -D app=dist/Ludolph.app Ludolph dist/Ludolph.dmg
          rm -rf dist/Ludolph.app
          cd dist
          shasum -a 256 "$ASSET" > "$ASSET.sha256"
          shasum -a 256 Ludolph.dmg > Ludolph.dmg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  linux:
    needs: version
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    # The oldest supported runner, so the binary needs only an older glibc.
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: ludolph-linux-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: oven-sh/setup-bun@v2
      - name: Build binary
        run: LUDOLPH_VERSION="$VERSION" cargo build --release --locked -p ludolph
      - name: Package
        run: |
          share=dist/ludolph/share/ludolph
          mkdir -p dist/ludolph/bin "$share"
          cp target/release/ludolph dist/ludolph/bin/
          cp LICENSE THIRD_PARTY_LICENSES.md "$share/"
          (cd extensions && bun install --frozen-lockfile && bun run build "$GITHUB_WORKSPACE/$share/pi")
          tar -czf "$ASSET" -C dist ludolph
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ${{ env.ASSET }}*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Build WSL engine
        run: LUDOLPH_VERSION="$VERSION" cargo build --release --no-default-features --locked -p ludolph
      - name: Package WSL engine
        run: |
          cp target/release/ludolph dist/ludolph/bin/
          tar -czf "ludolph-engine-linux-${{ matrix.arch }}.tar.gz" -C dist ludolph
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-engine-${{ matrix.arch }}
          path: ludolph-engine-linux-*.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows:
    needs: [version, linux]
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Build app
        run: LUDOLPH_VERSION="$VERSION" cargo build --release --locked -p ludolph
      - uses: actions/download-artifact@v8
        with:
          pattern: wsl-engine-*
          path: target/wsl
          merge-multiple: true
      - name: Build installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" scripts/windows.iss
      - name: Package
        run: |
          cp target/Ludolph-Setup.exe Ludolph-Setup.exe
          sha256sum Ludolph-Setup.exe > Ludolph-Setup.exe.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: Ludolph-Setup.exe*
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist
      - name: Sign Windows update
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$CERT_P12" | base64 --decode > "$work/cert.p12"
          openssl pkcs12 -legacy -in "$work/cert.p12" -passin env:CERT_PASSWORD -nocerts -nodes -out "$work/key.pem"
          openssl rsa -in "$work/key.pem" -RSAPublicKey_out -outform DER -out "$work/public.der"
          cmp assets/update-public-key.der "$work/public.der"
          sha=$(cut -d' ' -f1 dist/Ludolph-Setup.exe.sha256)
          printf '{"version":"%s","sha256":"%s"}\n' "$VERSION" "$sha" > dist/windows-update.json
          openssl dgst -sha256 -sign "$work/key.pem" -out dist/windows-update.sig dist/windows-update.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          changes=$(bash scripts/release_notes.sh "${previous:+$previous..}$GITHUB_SHA")
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "Ludolph v$VERSION" \
            --notes-file - \
            --latest <<EOF
          ## What's new

          $changes

          ## Install

          Ludolph needs [pi](https://pi.dev). It runs on a Mac with Apple silicon, on Linux, and on Windows with pi in WSL.

          - **Download:** get \`Ludolph.dmg\` below, open it, and drag Ludolph into Applications. The first time you open Ludolph, macOS blocks it because it isn't notarized: go to System Settings > Privacy & Security and click **Open Anyway**.
          - **Homebrew:** \`brew install --cask iyazerski/tap/ludolph\`
          - **Terminal:** \`curl -fsSL https://raw.githubusercontent.com/$GH_REPO/main/install.sh | sh\`
          - **Linux:** run the Terminal command above. It installs \`ludolph\` to \`~/.local/bin\`.
          - **Windows:** run \`Ludolph-Setup.exe\` below, then open Ludolph from the Start menu. It guides WSL and pi setup. Future updates install from Ludolph and keep its WSL engine in sync.
          EOF
      - name: Update Homebrew cask
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          sha=$(cut -d' ' -f1 dist/Ludolph.zip.sha256)
          export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "$DEPLOY_KEY" > "$RUNNER_TEMP/tap_key"
          chmod 600 "$RUNNER_TEMP/tap_key"
          git clone --depth 1 git@github.com:iyazerski/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/ludolph.rb
          git diff --stat
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "Update Ludolph to $VERSION"
          git push
