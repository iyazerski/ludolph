name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

# Only PR runs share a group, so a new push cancels the outdated run and frees its macOS runner.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Debug info makes up most of the cached target directory, and CI never reads it.
env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  phone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test phone UI and requests
        run: bun test crates/relay/tests

  extensions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extensions
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test

  rust:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - uses: oven-sh/setup-bun@v2
      - name: Bundle
        run: |
          cargo build --locked
          scripts/bundle.sh target/debug/ludolph 0.0.0 target
          plutil -lint target/Ludolph.app/Contents/Info.plist
          codesign --verify --strict target/Ludolph.app

  linux:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Test offline WSL engine setup
        run: |
          cargo build --no-default-features --locked -p ludolph
          cargo clippy --no-default-features --locked -p ludolph -- -D warnings
          sh scripts/test-wsl-install.sh target/debug/ludolph
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: wsl-test-engine
          path: target/wsl/*.tar.gz

  # Windows runs only the app; its engine is the Linux one, in WSL.
  windows:
    needs: linux
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7
      - name: Check shell payload line endings
        run: |
          foreach ($path in git ls-files '*.sh') {
            if ([IO.File]::ReadAllText((Resolve-Path $path)).Contains("`r")) {
              throw "Shell script has Windows line endings: $path"
            }
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy -p ludolph -p ludolph-ui --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test -p ludolph-ui --locked
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push'
        with:
          name: wsl-test-engine
          path: target/wsl
      - name: Test Windows installer
        if: github.event_name != 'push'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p ludolph
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DBuildProfile=debug scripts/windows.iss
          $setup = Resolve-Path target/Ludolph-Setup.exe
          $install = Join-Path $env:RUNNER_TEMP Ludolph
          $process = Start-Process $setup -ArgumentList "/VERYSILENT /NORESTART /DIR=`"$install`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) Ludolph.lnk
          if (!(Test-Path $shortcut)) { throw "Missing Start menu shortcut" }
          if (!(Test-Path "$install/wsl/ludolph-engine-linux-x86_64.tar.gz")) { throw "Missing WSL engine" }
          foreach ($exe in @($setup, (Join-Path $install Ludolph.exe))) {
            $resources = llvm-readobj --coff-resources $exe
            if (!($resources | Select-String 'Type: GROUP_ICON \(ID 14\)')) {
              throw "Missing icon resource in $exe"
            }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-windows-reopen.ps1 -App "$install/Ludolph.exe"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request' && !cancelled()
        with:
          name: windows-reopen-test-app
          retention-days: 3
          path: |
            target/debug/ludolph.exe
            scripts/test-windows-reopen.ps1

  relay:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Test
        run: cargo test -p ludolph-relay --locked

  licenses:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }
