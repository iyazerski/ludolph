name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  rust:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  licenses:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2.90.2
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: |
          make licenses
          git diff --exit-code THIRD_PARTY_LICENSES.md || {
            echo "::error::THIRD_PARTY_LICENSES.md is stale: run make licenses and commit it"
            exit 1
          }
