name: Relay image test (temporary)

on:
  pull_request:
    paths: ["crates/relay/Dockerfile", ".github/workflows/relay-image-test.yml"]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Cold build
        run: time docker buildx build -f crates/relay/Dockerfile --platform linux/amd64 -t relay .
      - name: Build after a source change
        run: |
          echo "// cache test" >> crates/relay/src/main.rs
          time docker buildx build --progress plain -f crates/relay/Dockerfile --platform linux/amd64 -t relay . 2>&1 | grep -E 'CACHED|RUN cargo|DONE [0-9.]+s$'
