# Generated by `make licenses`: hooks mustn't reformat it, or CI's freshness check fails.
exclude: ^THIRD_PARTY_LICENSES\.md$

repos:
  - repo: builtin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        files: \.rs$

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --locked
        language: system
        pass_filenames: false
        files: ^(crates/|src/|Cargo\.(toml|lock))

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        files: ^(crates/|src/|Cargo\.(toml|lock))
