[package]
name = "ludolph"
description = "A Mac app for pi coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["desktop"]
desktop = ["dep:ludolph-ui"]

[dependencies]
anyhow.workspace = true
ludolph-ui = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
ludolph-engine = { path = "crates/engine" }
tokio = { workspace = true, features = ["io-std"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist.workspace = true
serde.workspace = true

[build-dependencies]
embed-resource = "3"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/iyazerski/ludolph"
publish = false

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie", "typed-header"] }
base64 = "0.23"
block2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dispatch2 = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
linkify = "0.12"
notify = { version = "9", default-features = false }
ludolph-json-file = { path = "crates/json-file" }
ludolph-prompt = { path = "crates/prompt" }
ludolph-relay-proto = { path = "crates/relay-proto" }
ludolph-ui = { path = "crates/ui" }
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioNode", "AVAudioTime", "AVAudioTypes"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFDictionary", "CFNumber", "CFString", "std"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEventSource", "CGEventTypes", "std"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["libc", "ps", "std"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["FSEvents", "dispatch2", "std"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-speech = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionMetadata", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"] }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
plist = { version = "1", default-features = false, features = ["serde"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
# The windows. Rune is pre-release and changes often: keep one tested revision.
# Skip embedded-fonts (rune-theme-opencode supplies Inter + IBM Plex Mono) and ogg-audio (unused).
rune = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112", default-features = false, features = ["accessibility", "metal-backend", "svg"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112", default-features = false, features = ["markdown"] }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
# With only `ring` enabled, rustls picks its crypto provider on its own;
# tokio-tungstenite leaves that to the app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
security-framework = "3"
tempfile = "3"
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
web-push-native = { version = "0.5", default-features = false }
webauthn-rs = "0.6"
webpki-root-certs = "1"
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# Cargo does not inherit Rune's patches. Keep them at the same revision as Rune.
[patch.crates-io]
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
naga = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }
winit = { git = "https://github.com/anomalyco/rune", rev = "a538f2c7466d0dd1529a8011cad56461e07d9112" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# A panic exits the process, so launchd restarts the engine, rather than
# leaving it running with a poisoned lock and failing every call.
[profile.release]
panic = "abort"
