[package]
name = "ludolph"
description = "A Mac app for pi coding agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
ludolph-engine = { path = "crates/engine" }
tokio.workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/iyazerski/ludolph"
publish = false

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
dispatch2 = { version = "0.3", default-features = false, features = ["alloc"] }
libc = "0.2"
ludolph-json-file = { path = "crates/json-file" }
ludolph-relay-proto = { path = "crates/relay-proto" }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFArray", "CFString", "std"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["FSEvents", "dispatch2", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# With only `ring` enabled, rustls picks its crypto provider on its own;
# tokio-tungstenite leaves that to the app.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"

# A panic exits the process, so launchd restarts the engine, rather than
# leaving it running with a poisoned lock and failing every call.
[profile.release]
panic = "abort"
