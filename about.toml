# cargo-about settings for THIRD_PARTY_LICENSES.md: run `make licenses`.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The app, and the relay's container images.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Ludolph's own crates (publish = false) are under LICENSE.
private = { ignore = true }
